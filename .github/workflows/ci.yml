name: CI

# Builds the C core, compiles every production shader (HLSL -> SPIR-V, MSL, and metallib on macOS)
# with the vendored SDL_shadercross, runs the native tests and checks the public headers on their own.
# The device and window smoke tests need a GPU and a display, which hosted runners lack; run them by
# hand (see COORDINATION.md).

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC, SPIR-V)
            os: windows-2022
          - name: macOS (Clang, MSL + metallib)
            os: macos-14
    env:
      BUILD_DIR: ${{ github.workspace }}/build
      GPU_TESTS_EXCLUDE: btbh_gpu_device_smoke|btbh_gpu_window_smoke
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Submodule key
        id: key
        shell: bash
        run: echo "hash=$(git submodule status --recursive | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # DXC, SPIRV-Cross, SDL and Assimp take most of a cold build; they only change with the submodules.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: build
          key: native-${{ matrix.os }}-${{ steps.key.outputs.hash }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            native-${{ matrix.os }}-${{ steps.key.outputs.hash }}-

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DR3D_ASSIMP_VENDORED=ON \
            -DBTBH_BUILD_GPU_SPIKE=ON \
            -DBTBH_BUILD_GPU_NATIVE_TESTS=ON \
            -DBTBH_BUILD_GPU_PACKAGE_RUNTIME=ON

      - name: Build (C core, shaders, tests)
        shell: bash
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Shader artifacts present
        shell: bash
        run: |
          out="$BUILD_DIR/generated/btbh_gpu/shaders"
          expected=$(grep -oE '"production_[a-z0-9_]+\.(vert|frag|comp)\|' CMakeLists.txt | tr -d '"|' | sort -u)
          missing=0
          for name in $expected; do
            [ -f "$out/$name.spv" ] || { echo "missing $name.spv"; missing=1; }
            [ -f "$out/$name.msl" ] || { echo "missing $name.msl"; missing=1; }
            if [ "$RUNNER_OS" = "macOS" ]; then
              [ -f "$out/$name.metallib" ] || { echo "missing $name.metallib"; missing=1; }
            fi
          done
          echo "$(echo "$expected" | wc -w) shaders checked"
          exit $missing

      - name: Native tests
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure -E "$GPU_TESTS_EXCLUDE"

      - name: Public headers stand alone (C11 and C++17)
        shell: bash
        run: |
          printf '#include <btbh_gpu/btbh_gpu.h>\n#include <btbh_gpu/btbh_gpu_resources.h>\nint main(void){return 0;}\n' > header_check.c
          cp header_check.c header_check.cpp
          if [ "$RUNNER_OS" = "Windows" ]; then
            cl /nologo /W4 /WX /std:c11 /Iinclude /Iexternal/SDL/include /c header_check.c
            cl /nologo /W4 /WX /std:c++17 /EHsc /Iinclude /Iexternal/SDL/include /c header_check.cpp
          else
            cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -Iexternal/SDL/include -c header_check.c
            c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Iexternal/SDL/include -c header_check.cpp
          fi

      - name: Upload shaders
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: shaders-${{ runner.os }}
          path: build/generated/btbh_gpu/shaders/production_*
